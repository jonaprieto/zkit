name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh and eza
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install eza
          else
            sudo apt-get update -q
            sudo apt-get install -yq zsh eza
          fi

      - name: Syntax
        run: |
          for f in zkit.zsh functions/* tests/*.zsh; do
            [ -e "$f" ] || continue
            zsh -n "$f" || exit 1
          done

      - name: Tests
        run: zsh tests/run.zsh

  formula:
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4

      - name: Audit the formula as committed
        run: |
          brew tap-new --no-git ci/local
          tap=$(brew --repository ci/local)
          cp Formula/zkit.rb "$tap/Formula/zkit.rb"
          brew audit --strict ci/local/zkit

      - name: Install and test it from this checkout
        run: |
          # actions/checkout leaves a detached HEAD
          b=ci-${GITHUB_SHA::7}
          git checkout -q -B "$b"
          tap=$(brew --repository ci/local)
          from='head "https://github.com/jonaprieto/zkit.git"'
          from+=', branch: "main"'
          to="head \"file://$PWD\", using: :git, branch: \"$b\""
          sed "s|$from|$to|" Formula/zkit.rb > "$tap/Formula/zkit.rb"
          # a sed that matched nothing would install from GitHub
          grep -q "file://$PWD" "$tap/Formula/zkit.rb"
          brew install --HEAD ci/local/zkit
          brew test ci/local/zkit
