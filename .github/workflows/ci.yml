name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh and eza
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install eza
          else
            sudo apt-get update -q
            sudo apt-get install -yq zsh eza
          fi

      - name: Syntax
        run: |
          for f in zkit.zsh functions/* tests/*.zsh; do
            [ -e "$f" ] || continue
            zsh -n "$f" || exit 1
          done

      - name: Tests
        run: zsh tests/run.zsh
